name: Feature request
description: Suggest a new page, component, workflow, or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: request
    attributes:
      label: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this useful?
  - type: textarea
    id: details
    attributes:
      label: Suggested behavior or structure
      description: Include routes, filters, components, or data model details if relevant.
  - type: textarea
    id: references
    attributes:
      label: References or examples
